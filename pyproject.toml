[project]
name = "ida-nexus-emu"
version = "0.1.0"
description = "Lazy IDA-backed memory for Unicorn, so reverse-engineering agents can emulate IDA-analyzed code without hand-copying bytes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paolo Montesel" }]
keywords = [
    "ida",
    "ida-pro",
    "unicorn",
    "emulation",
    "reverse-engineering",
    "agentic-reversing",
    "ai-agents",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "ida-nexus>=0.13,<0.14",
    "unicorn>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/thebabush/ida-nexus-emu"
Repository = "https://github.com/thebabush/ida-nexus-emu"
Issues = "https://github.com/thebabush/ida-nexus-emu/issues"
Changelog = "https://github.com/thebabush/ida-nexus-emu/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_nexus_emu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ty.environment]
python-version = "3.11"

# Strict-leaning overrides on top of ty's defaults (95/136 rules already
# error by default). Picked for low false-positive risk; validated that
# [tool.ty.rules] overrides are actually honored (see dev notes), not that
# every rule below is noise-free against this codebase yet.
[tool.ty.rules]
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
possibly-unresolved-reference = "error"
unresolved-global = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
missing-type-argument = "warn"
possibly-missing-attribute = "warn"
